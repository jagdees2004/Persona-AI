<script>
// Generate or retrieve user ID
let userId = localStorage.getItem("persona_ai_user_id");
if (!userId) {
    userId = "user_" + Math.random().toString(36).substring(2, 10);
    localStorage.setItem("persona_ai_user_id", userId);
}

document.getElementById('continue-btn').addEventListener('click', async () => {
    const name = document.getElementById('name-input').value.trim();
    const age = parseInt(document.getElementById('age-input').value);
    const gender = document.getElementById('gender-select').value;
    
    if (!name) {
        alert("Please enter your name to continue exploring the digital ether.");
        return;
    }
    
    const payload = {
        user_id: userId,
        name: name,
        age: isNaN(age) ? null : age,
        gender: gender,
        interests: [],
        communication_style: "casual"
    };
    
    try {
        const response = await fetch('/onboarding', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        });
        
        if (response.ok) {
            window.location.href = '/frontend/persona_selection_grid.html';
        } else {
            console.error("Failed to save profile:", await response.text());
            alert("Error saving your profile. Please try again.");
        }
    } catch (e) {
        console.error("Network error:", e);
        alert("Network error. Make sure the server is running.");
    }
});
</script>
